<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitFuel prototype, moderator view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* FitFuel return-session prototype. Brand brown #0E1726, cream #FFFFFF and tints of brown only. */
.ff{--b:#0E1726;--b80:#2A3547;--b70:#4A5568;--b60:#7A879A;--b40:#A9B4C4;--b30:#D5DCE6;--c:#FFFFFF;--page:#F5F7FA;--well:#EEF2F8;--c80:#B9C4D6;--c70:#8E9BB0;--a:#2F5BEA;--a2:#2A52D6;--asoft:#E4EAFB;--line:#D5DCE6;--deep:#080E1A;--raise:#1B2840;
  position:relative;width:390px;height:844px;overflow:hidden;background:var(--page);color:var(--b);
  font-family:'Figtree',Degular,system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;border-radius:44px;isolation:isolate}
.ff.x2{font-size:32px}
.ff *{box-sizing:border-box}
.ff :where(button,a,input){font:inherit;color:inherit}
.ff button{cursor:pointer}
.ff :focus{outline:none}
.ff :focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:14px}
.ff .dk :focus-visible,.ff .dk:focus-visible,.ff .dockdk :focus-visible{outline-color:var(--c)}
.grain{position:relative}
.grain::after{display:none;content:"";position:absolute;inset:0;background:none;background-size:160px;pointer-events:none;mix-blend-mode:multiply;opacity:.55;border-radius:inherit;z-index:0}
.grain.dk::after{mix-blend-mode:screen;opacity:.35}
.grain>*{position:relative;z-index:1}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* layout */
.mwrap{flex:1 1 auto;min-height:0;position:relative}
.main{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.main::-webkit-scrollbar{display:none}
.scr{min-height:100%;display:flex;flex-direction:column;animation:ff-in .42s cubic-bezier(.2,.7,.2,1) both}
.dk{background:var(--b);color:var(--c)}
.eyebrow{font-size:.875em;font-weight:650;letter-spacing:.12em;text-transform:uppercase;line-height:1.3;margin:0}
.muted{color:var(--b70)}
.dk .muted{color:var(--c80)}
.h1{font-size:2.5em;line-height:1.02;letter-spacing:-.035em;font-weight:720;margin:0;text-wrap:balance}
.h2{font-size:1.75em;line-height:1.08;letter-spacing:-.03em;font-weight:700;margin:0;text-wrap:balance}
.h3{font-size:1.25em;line-height:1.2;letter-spacing:-.015em;font-weight:680;margin:0}
.p{margin:0;font-size:1em;line-height:1.5}
.sm{font-size:.875em;line-height:1.45}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0;gap:12px}
.mark{width:22px;height:auto;display:block}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1.5px solid currentColor;font-size:.875em;font-weight:600;line-height:1.2}

/* hero */
.hero{padding:0 0 48px;border-radius:0 0 34px 34px;overflow:hidden}
.hero .art{position:absolute;right:-28px;top:44px;width:200px;height:200px;opacity:1;z-index:0}
.hero-in{padding:8px 24px 0;display:flex;flex-direction:column;gap:14px;position:relative;z-index:1}
.hero .h1{max-width:9.2em}

/* cards */
.wrap{padding:0 16px;display:flex;flex-direction:column;gap:16px}
.card{background:#FFFFFF;border-radius:24px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(14,23,38,.04),0 16px 36px -18px rgba(14,23,38,.18)}
.lift{margin-top:-40px;position:relative;z-index:2}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--b80);font-size:.9375em;font-weight:560}
.meta span{display:inline-flex;align-items:center;gap:6px}
.reason{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--asoft);margin-top:14px}
.reason .ic{margin-top:2px;color:var(--a2)}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;margin-left:-4px;background:none;border:0;font-weight:650;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;color:var(--a2)}
.dk .link{color:var(--c)}

/* length picker */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;border:0}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;border-radius:18px;border:2px solid var(--b60);background:var(--c);cursor:pointer;transition:background .2s,color .2s,transform .15s;padding:8px 4px;text-align:center}
.opt:active{transform:scale(.98)}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt:has(input:focus-visible){outline:3px solid var(--a);outline-offset:3px}
.opt.on{background:var(--a);color:#FFFFFF;border-color:var(--a)}
.opt .num{font-size:1.75em;font-weight:720;letter-spacing:-.03em;line-height:1}
.opt .unit{font-size:.875em;font-weight:600}
.tick{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:#FFFFFF;color:var(--a2);display:flex;align-items:center;justify-content:center}
.tick .ic{width:14px;height:14px;stroke-width:2.5}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:999px;border:2px solid var(--a);background:var(--a);color:#FFFFFF;font-weight:600;font-size:1.0625em;letter-spacing:-.01em;width:100%;text-decoration:none;box-shadow:0 12px 24px -12px rgba(47,91,234,.7);transition:transform .15s,background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.btn:not(.ghost):not(.tone):not(.off):hover{background:#2447C8;border-color:#2447C8;box-shadow:0 14px 26px -12px rgba(36,71,200,.75)}
.btn:not(.ghost):not(.tone):not(.off):active{background:#1E3BA8;border-color:#1E3BA8}
.btn.ghost:hover{background:var(--asoft)}
.btn.tone:hover{background:var(--well)}
.dk .btn:not(.ghost):not(.tone):not(.off):hover{background:#E4EAFB;border-color:#E4EAFB}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--a2);border-color:var(--a2);box-shadow:none}
.btn.tone{background:#FFFFFF;color:var(--b);border-color:var(--b60);box-shadow:none}
.dk .btn{background:#FFFFFF;color:var(--b);border-color:#FFFFFF;box-shadow:none}
.dk .btn.ghost{background:transparent;color:var(--c)}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--b60);background:var(--c);font-weight:620;font-size:.9375em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.x2 .pair{grid-template-columns:1fr}

/* ask cards */
.q{display:flex;flex-direction:column;gap:10px}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;margin:0;padding:0}
.x2 .qgrid{grid-template-columns:repeat(1,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:84px;padding:12px 12px 10px;border-radius:18px;border:1.5px solid var(--b60);background:#FFFFFF;cursor:pointer;transition:background .2s,color .2s,transform .15s}
.tile.s{min-height:48px;flex-direction:row;align-items:center;justify-content:flex-start;padding:10px 12px}
.tile:active{transform:scale(.98)}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.tile:has(input:focus-visible){outline:3px solid var(--a);outline-offset:3px}
.tile.on{background:var(--a);color:#FFFFFF;border-color:var(--a)}
.tile .lbl{font-weight:650;line-height:1.2;font-size:.9375em}
.tile .gl{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:4px;align-items:flex-end;height:22px}
.dots i{display:block;width:6px;border-radius:3px;border:1.5px solid currentColor}
.dots i.f{background:currentColor}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(8,14,26,.55);z-index:20;animation:ff-fade .3s ease both;border:0;padding:0;margin:0;width:100%;cursor:default}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 40px);overflow-y:auto;z-index:21;background:#FFFFFF;border-radius:30px 30px 0 0;padding:10px 20px 24px;box-shadow:0 -20px 50px -20px rgba(8,14,26,.6);animation:ff-up .42s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--b40);margin:0 auto 14px}
.sheethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--b60);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--b)}
.dk .iconbtn{border-color:var(--c70);color:var(--c)}
.inrow{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.inrow:first-child{border-top:0}
.inrow .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.edit{min-height:44px;min-width:64px;padding:0 16px;border-radius:999px;border:1.5px solid var(--b60);background:transparent;font-weight:650;font-size:.9375em;flex:none}
.edit[aria-expanded="true"]{background:var(--a);color:#FFFFFF;border-color:var(--a)}
.choices{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.choice{min-height:44px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--b60);background:var(--c);font-weight:600;font-size:.9375em;display:inline-flex;align-items:center;gap:6px;text-align:left}
.choice.on{background:var(--a);color:#FFFFFF;border-color:var(--a)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--well);margin-top:6px}
.action{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--b);width:100%;text-align:left;padding:16px;border-radius:18px;border:1.5px solid var(--b60);background:#FFFFFF;min-height:72px;transition:transform .15s}
.action:active{transform:scale(.99)}
.action.strong{background:var(--b);color:#FFFFFF;border-color:var(--b)}
.action .badge{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor}
.sos{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--b60)}

/* dock: Something hurts, always same spot */
.dock{flex:none;padding:8px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFFFFF;border-top:1.5px solid rgba(14,23,38,.12);position:relative;z-index:30}
.dock.dockdk{background:#0E1726;color:var(--c);border-top:0;padding-top:4px}
.hurt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--b60);background:transparent;color:var(--b);font-weight:620;font-size:.9375em}
.hurt[aria-expanded="true"]{background:var(--b);color:#FFFFFF;border-color:var(--b)}
.dockdk .hurt{background:#D92D20;border-color:#D92D20;color:#FFFFFF;min-height:52px;padding:0 24px;font-weight:700;font-size:1em;width:100%}
.dockdk .hurt[aria-expanded="true"]{background:#FFFFFF;color:#B42318;border-color:#FFFFFF}
.foot{margin:0;text-align:center;font-size:.875em;line-height:1.3;color:var(--b70)}
.dockdk .foot{color:var(--c80)}

/* session */
.sess{flex:1;display:flex;flex-direction:column;background:#0E1726}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0;margin:0;list-style:none}
.segs li{height:22px;border-radius:999px;border:1.5px solid var(--c70);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.segs li.done{background:#7FA0FF;border-color:#7FA0FF;color:var(--b)}
.segs li.cur{border-color:#7FA0FF;border-width:2px}
.segs li .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(127,160,255,.35);transition:width 1s linear}
.segs li .ic{width:14px;height:14px;stroke-width:2.75;position:relative}
.timerwrap{position:relative;width:260px;height:260px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.breath{position:absolute;inset:14px;border-radius:50%;background:rgba(127,160,255,.12);animation:ff-breathe 8s ease-in-out infinite}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:rgba(255,255,255,.18)}
.ring .bar{stroke:#7FA0FF;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.time{font-size:4.25em;font-weight:640;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.x2 .time{font-size:3em}
.x2 .timerwrap{width:240px;height:240px}
.audio{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--c70);background:transparent;color:var(--c);font-weight:600;font-size:.875em}
.audio[aria-pressed="false"]{border-style:dashed}
.bars{display:inline-flex;gap:2px;align-items:center;height:14px}
.bars i{display:block;width:3px;height:6px;background:currentColor;border-radius:2px;animation:ff-eq 1.2s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.6s}
.ctrl{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:stretch}
.x2 .ctrl{grid-template-columns:1fr}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:72px;border-radius:20px;border:1.5px solid #8E9BB0;background:#1B2840;color:#FFFFFF;font-weight:620;font-size:.875em;padding:8px}
.cbtn.big{background:var(--a);color:#FFFFFF;border-color:var(--a);font-size:1em}
.cbtn .ic{width:24px;height:24px}
.swapnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);animation:ff-in .5s ease both}
.moveart{width:84px;height:84px;flex:none;color:#7FA0FF}

/* done */
.check{width:112px;height:112px}
.check circle{fill:none;stroke:#FFFFFF;stroke-width:3;stroke-dasharray:340;stroke-dashoffset:340;animation:ff-draw 1s cubic-bezier(.6,.1,.2,1) .15s forwards}
.check path{fill:none;stroke:#FFFFFF;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:ff-draw .6s cubic-bezier(.6,.1,.2,1) .85s forwards}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-size:2.5em;font-weight:720;letter-spacing:-.04em;line-height:1}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--asoft);border:1px solid #B9C9F6;animation:ff-in .4s ease both}

/* motion */
@keyframes ff-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ff-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes ff-fade{from{opacity:0}to{opacity:1}}
@keyframes ff-breathe{0%,100%{transform:scale(.86);opacity:.55}50%{transform:scale(1.06);opacity:1}}
@keyframes ff-draw{to{stroke-dashoffset:0}}
@keyframes ff-eq{0%,100%{height:4px}50%{height:14px}}
@keyframes ff-drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-6px,4px) rotate(-3deg)}}
.drift{animation:ff-drift 14s ease-in-out infinite;transform-origin:60% 40%}
.ff.rm *,.ff.rm *::before,.ff.rm *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
.ff.rm .breath{transform:none;opacity:.8}
@media (prefers-reduced-motion:reduce){
  .ff *,.ff *::before,.ff *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* moderator stage */
.stage{font-family:'Figtree',Degular,system-ui,sans-serif;color:#0E1726}
.stage *{box-sizing:border-box}
.stage :focus-visible{outline:3px solid #2F5BEA;outline-offset:3px}
.mod{display:flex;flex-direction:column;gap:22px}
.mtog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:0;padding:0;margin:0}
.mopt{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:18px;border:2px solid #7A879A;background:#FFFFFF;cursor:pointer;min-height:88px}
.mopt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mopt:has(input:focus-visible){outline:3px solid #2F5BEA;outline-offset:3px}
.mopt.on{background:#2F5BEA;color:#FFFFFF;border-color:#2F5BEA}
.jump{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jb{min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid #7A879A;background:transparent;font:inherit;font-weight:600;font-size:14px;text-align:left;color:#0E1726;cursor:pointer}
.jb:hover{background:#FFFFFF}
.mchk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer}
.mchk input{width:22px;height:22px;accent-color:#2F5BEA;margin:0}
.device{padding:10px;border-radius:54px;background:#0E1726;box-shadow:0 0 0 1.5px #2A3547 inset,0 40px 80px -30px rgba(14,23,38,.45),0 18px 30px -18px rgba(14,23,38,.4)}

.sheet h2:focus{outline:none}
.sheet h2:focus-visible{outline:3px solid var(--b);outline-offset:4px;border-radius:6px}

.eyebrow.ac{color:var(--a2)}
.hero.lt{background:transparent;color:var(--b);padding-bottom:16px;border-radius:0}
.hero.done{background:var(--a);color:#FFFFFF}
.painnote{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--asoft);border:1px solid #B9C9F6;animation:ff-in .35s ease both}
.painbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--b);background:var(--b);color:#FFFFFF;font-weight:650;font-size:.9375em}

.ff.insess,.ff.insess .mwrap,.ff.insess .main{background:#0E1726}
.ff.insess .scr.sess{min-height:100%}

.btn.off{background:#E4EAFB;border-color:#E4EAFB;color:#4A5568;box-shadow:none;cursor:not-allowed}
.btn.off:active{transform:none}

.btn.sec{min-height:52px;font-size:1em;padding:10px 14px;gap:8px}
.btn.sec .ic{color:var(--a2)}
.sos911{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;padding:12px 14px;border-radius:16px;border:2px solid #D92D20;background:#FFFFFF;color:var(--b);text-decoration:none;transition:background-color .18s ease}
.sos911:hover{background:#FDECEA}
.sos911:active{background:#FAD9D5}
.sosic{width:40px;height:40px;border-radius:50%;background:#D92D20;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.sostx{display:flex;flex-direction:column;gap:2px;min-width:0}
.sost{font-weight:650;line-height:1.3}
.sosa{font-size:.875em;font-weight:600;color:#B42318;text-decoration:underline;text-underline-offset:3px}

.hero.lt{overflow:visible;z-index:0}
.scr > .wrap{position:relative;z-index:1}
.sosbox{display:flex;flex-direction:column;gap:12px;width:100%;padding:14px;border-radius:16px;border:2px solid #D92D20;background:#FFFFFF;color:var(--b)}
.sosbox .sost{margin:0;font-weight:650;line-height:1.35}
.callbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:999px;background:#D92D20;border:2px solid #D92D20;color:#FFFFFF;font-weight:600;font-size:1.0625em;text-decoration:none;transition:background-color .18s ease,border-color .18s ease}
.callbtn:hover{background:#B42318;border-color:#B42318}
.callbtn:active{background:#912018;border-color:#912018}
.ff .callbtn:focus-visible{outline:3px solid #D92D20;outline-offset:3px;border-radius:999px}

.action > span:last-child{text-align:left;min-width:0}
.action.call{border:2px solid #D92D20;transition:background-color .18s ease}
.action.call .badge{background:#D92D20;border-color:#D92D20;color:#FFFFFF}
.action.call:hover{background:#FDECEA}
.action.call:active{background:#FAD9D5}
.ff .action.call:focus-visible{outline:3px solid #D92D20;outline-offset:3px;border-radius:18px}

eyebrow muted\">This<br>week</p><p class=\"n\" style=\"margin: 6px 0 0\">1</p><p class=\"p sm muted\" style=\"margin: 0\">session</p></div>\n<div class=\"stat\" style=\"border-left: 1.5px solid #D5DCE6; padding-left: 16px\"><p class=\"eyebrow muted\">In your<br>record</p><p class=\"n\" style=\"margin: 6px 0 0\">24</p><p class=\"p sm muted\" style=\"margin: 0\">sessions</p></div>\n</div>\n<div class=\"card\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 14px; align-items: center\">\n<span style=\"width: 48px; height: 48px; border-radius: 16px; background: #0E1726; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\" rx=\"2.5\"/><path d=\"M4 10h16M9 3v4M15 3v4\"/></svg></span>\n<div><p class=\"eyebrow muted\">Next</p><p class=\"h3\" style=\"margin-top: 4px\">Thursday, same level.</p></div>\n</div>\n<div role=\"status\" style=\"display: flex; flex-direction: column\">\n<sc-if value=\"{{calNotAdded}}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"btn tone sec\" onClick=\"{{addCal}}\" aria-label=\"Add to calendar, Thursday\"><span>Add to calendar</span></button></sc-if>\n<sc-if value=\"{{calAdded}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"banner\" style=\"margin: 0\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg><span class=\"p sm\" style=\"font-weight: 600\">Added to your calendar for Thursday.</span></p></sc-if>\n</div>\n</div>\n<button type=\"button\" class=\"btn\" onClick=\"{{closeDone}}\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg><span>Finish session</span></button>\n</div>\n</section>\n</sc-if>\n\n</div>\n\n<!-- ============ SHEETS ============ -->\n<sc-if value=\"{{sheetOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<button type=\"button\" class=\"scrim\" aria-label=\"Close\" tabindex=\"-1\" onClick=\"{{closeSheet}}\"></button>\n<div class=\"sheet grain\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheet-h\" onKeyDown=\"{{sheetKey}}\">\n<div class=\"grab\" aria-hidden=\"true\"></div>\n<div class=\"sheethead\">\n<h2 class=\"h2\" id=\"sheet-h\" tabindex=\"-1\" ref=\"{{sheetRef}}\">{{sheetTitle}}</h2>\n<button type=\"button\" class=\"iconbtn\" aria-label=\"Close\" onClick=\"{{closeSheet}}\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg></button>\n</div>\n\n<sc-if value=\"{{sheetWhy}}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"p muted\" style=\"margin-bottom: 8px\">Today’s session comes from these four things.</p>\n<div>\n<sc-for list=\"{{whyRows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div class=\"inrow\" role=\"group\" aria-labelledby=\"{{r.hid}}\">\n<p class=\"eyebrow muted\" id=\"{{r.hid}}\">{{r.label}}</p>\n<sc-if value=\"{{r.hasNote}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"p sm muted\">{{r.note}}</p></sc-if>\n<sc-if value=\"{{r.hasChoices}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"choices\">\n<sc-for list=\"{{r.choices}}\" as=\"ch\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"{{ch.cls}}\" aria-pressed=\"{{ch.on}}\" onClick=\"{{ch.pick}}\"><sc-if value=\"{{ch.on}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/></svg></sc-if>{{ch.label}}</button>\n</sc-for>\n</div>\n</sc-if>\n<sc-if value=\"{{r.isAnswers}}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"p\" style=\"font-weight: 600\">{{r.value}}</p>\n<button type=\"button\" class=\"link\" aria-haspopup=\"dialog\" onClick=\"{{openAsk}}\">Update how you feel today<svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"/></svg></button>\n</sc-if>\n</div>\n</sc-for>\n</div>\n<div class=\"rule\"><svg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 11v5M12 8h.01\"/></svg><p class=\"p sm\" style=\"font-weight: 560\">A fixed rule sets the step down. You can change any of these.</p></div>\n<p class=\"p sm muted\" style=\"margin: 10px 0 0\">Fitness guidance, not medical advice.</p>\n<button type=\"button\" class=\"{{saveCls}}\" style=\"margin-top: 16px\" aria-disabled=\"{{saveDisabled}}\" aria-describedby=\"save-hint\" onClick=\"{{saveWhy}}\">Save</button>\n<p class=\"p sm muted\" id=\"save-hint\" style=\"text-align: center; margin-top: 8px\">{{saveHint}}</p>\n</sc-if>\n\n<sc-if value=\"{{sheetAsk}}\" hint-placeholder-val=\"{{ false }}\">\n<p class=\"p muted\" style=\"margin-bottom: 18px\">Optional. Today’s session updates to match.</p>\n<div style=\"display: flex; flex-direction: column; gap: 22px\">\n\n<sc-for list=\"{{askSheet}}\" as=\"grp\" hint-placeholder-count=\"3\">\n<fieldset class=\"q\" style=\"border: 0; margin: 0; padding: 0; min-width: 0\">\n<legend class=\"eyebrow muted\" style=\"padding: 0; margin-bottom: 10px\">{{grp.title}}</legend>\n<div class=\"{{grp.gridCls}}\">\n<sc-for list=\"{{grp.items}}\" as=\"it\" hint-placeholder-count=\"3\">\n<label class=\"{{it.cls}}\">\n<input type=\"{{grp.type}}\" name=\"{{grp.name}}\" value=\"{{it.id}}\" checked=\"{{it.on}}\" onChange=\"{{it.pick}}\">\n<sc-if value=\"{{it.gFine}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"gl\" viewBox=\"0 0 28 28\" aria-hidden=\"true\"><circle cx=\"14\" cy=\"14\" r=\"10\"/><path d=\"M9.5 16.5c2.5 2.4 6.5 2.4 9 0\"/></svg></sc-if>\n<sc-if value=\"{{it.gStiff}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"gl\" viewBox=\"0 0 28 28\" aria-hidden=\"true\"><path d=\"M3 18l5.5-8 5.5 8 5.5-8L25 18\"/></svg></sc-if>\n<sc-if value=\"{{it.gHurts}}\" hint-placeholder-val=\"{{ false }}\"><svg class=\"gl\" viewBox=\"0 0 28 28\" aria-hidden=\"true\"><rect x=\"3\" y=\"10\" width=\"22\" height=\"8\" rx=\"4\" transform=\"rotate(-45 ing !== p.opening) {\n      this._d = this.defaults();\n      this.setState(Object.assign({}, this._d));\n      return;\n    }\n    const s = this.st();\n    if (this._mainEl) { try { this._mainEl.inert = !!s.sheet; } catch (e) {} }\n    if (s.sheet && s.sheet !== this._lastSheet) {\n      if (!this._lastSheet) { try { this._returnTo = document.activeElement; } catch (e) {} }\n      if (this._sheetEl) { try { this._sheetEl.focus(); } catch (e) {} }\n    }\n    if (!s.sheet && this._lastSheet && this._returnTo) {\n      const t = this._returnTo; this._returnTo = null;\n      setTimeout(() => { try { if (t.isConnected) t.focus(); } catch (e) {} }, 0);\n    }\n    this._lastSheet = s.sheet;\n  }\n  per(len) { return Math.round(len * 60 / 3); }\n  tick() {\n    const s = this.st();\n    if (s.screen !== 'session' || !s.running || s.sheet) return;\n    const per = this.per(s.length);\n    const r = s.remaining - 1, el = s.elapsed + 1;\n    if (r <= 0) {\n      if (s.move < 2) this.setState({ move: s.move + 1, remaining: per, elapsed: el });\n      else this.setState({ screen: 'done', ended: { min: s.length, early: false }, elapsed: el });\n    } else this.setState({ remaining: r, elapsed: el });\n  }\n  finish(early) {\n    const s = this.st();\n    const min = Math.max(1, Math.round(s.elapsed / 60));\n    this.setState({ screen: 'done', sheet: null, ended: { min: Math.min(min, s.length), early: early || min < s.length } });\n  }\n  area(s) {\n    const map = { knee: 'knee', back: 'back', shoulder: 'shoulder', hip: 'hip', other: 'sore spot' };\n    const chosen = (s.answered ? s.ans.protect : []).filter((x) => x !== 'none').map((x) => map[x]);\n    if (chosen.length) return chosen.length > 1 ? chosen.slice(0, -1).join(', ') + ' and ' + chosen[chosen.length - 1] : chosen[0];\n    if (s.answered && s.ans.protect.indexOf('none') >= 0) return s.knee !== 'none' ? 'knee' : null;\n    return s.knee !== 'none' ? 'knee' : null;\n  }\n  reason(s) {\n    const area = this.area(s);\
